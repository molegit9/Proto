<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹보안관 — 위험 사이트 차단</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2a1215 0%, #0f172a 70%);
      color: #f8fafc;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-top: 5px solid #ef4444;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      line-height: 1.35;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .info-box {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 22px;
    }
    .info-row {
      margin-bottom: 10px;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .url-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #fecaca;
      word-break: break-all;
    }
    .reason-text {
      font-size: 14px;
      color: #f1f5f9;
      line-height: 1.5;
      white-space: pre-line;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.99); }
    .btn-safe {
      background: #10b981;
      color: #052e16;
    }
    .btn-safe:hover { opacity: 0.92; }
    .btn-proceed {
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
      font-weight: 500;
      font-size: 13px;
    }
    .btn-proceed:hover {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.45);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">🛡️ 웹보안관 능동 보호 (DeclarativeNetRequest)</div>
    <h1>위험한 웹사이트 접속을 차단했습니다</h1>
    <p class="subtitle">
      웹보안관이 해당 링크에서 피싱·사칭 또는 악성 위협 징후를 감지하여 브라우저 단계에서 접속을 자동으로 막았습니다.
    </p>

    <section class="info-box">
      <div class="info-row">
        <span class="label">차단된 URL</span>
        <div id="blocked-url" class="url-text">-</div>
      </div>
      <div class="info-row">
        <span class="label">보안 점수</span>
        <div id="blocked-score" class="reason-text">-</div>
      </div>
      <div class="info-row">
        <span class="label">차단 사유</span>
        <div id="blocked-reason" class="reason-text">위험 사이트로 판정되었습니다.</div>
      </div>
    </section>

    <div class="actions">
      <button id="go-back-btn" class="btn btn-safe">🛡️ 안전하게 이전 페이지로 돌아가기</button>
      <button id="proceed-btn" class="btn btn-proceed">⚠️ 위험을 이해했으며, 이 URL 차단을 해제하고 이동</button>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
